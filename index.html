<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Realtime Train API</title>
</head>
<body>
<h2>Train Info</h2>
<button onclick="load()">取得</button>
<pre id="out"></pre>

<script>
async function load(){
  const res = await fetch("https://your-worker.workers.dev/api");
  const data = await res.json();
  document.getElementById("out").textContent =
    JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
