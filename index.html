<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Train API</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:30px}
button{padding:10px 20px;font-size:16px}
pre{background:#222;padding:15px;margin-top:20px}
</style>
</head>
<body>
<h2>Train API Test</h2>
<button onclick="load()">取得</button>
<pre id="out">Waiting...</pre>

<script>
async function load(){
  const res = await fetch("https://train-api-pre.tt9549149.workers.dev/api");
  try {
    const data = await res.json();
    document.getElementById("out").textContent = JSON.stringify(data,null,2);
  } catch(e){
    document.getElementById("out").textContent = "取得失敗: "+e;
  }
}
</script>
</body>
</html>
