<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ODPT API Test</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px; cursor: pointer; background: #444; color: #fff; border: 1px solid #666; border-radius: 4px; }
        button:hover { background: #555; }
        pre { background: #222; padding: 15px; border-radius: 5px; overflow-x: auto; border: 1px solid #333; }
        .loading { color: #ffad00; }
    </style>
</head>
<body>

    <h2>ODPT データ取得 (via Cloudflare)</h2>
    
    <div class="controls">
        <button onclick="getData('bus')">横浜市営バス 取得</button>
        <button onclick="getData('flight')">日本航空 (JAL) 取得</button>
    </div>

    <pre id="out">ボタンを押すとデータが表示されます...</pre>

    <script>
    async function getData(type) {
        const out = document.getElementById("out");
        out.textContent = "読み込み中...";
        out.className = "loading";

        // あなたのCloudflare WorkerのURL
        const workerUrl = `https://train-api-pre.tt9549149.workers.dev/api?type=${type}`;

        try {
            const res = await fetch(workerUrl);
            const data = await res.json();

            if (!res.ok) {
                out.textContent = `エラーが発生しました: ${data.error || res.statusText}`;
                out.className = "";
                return;
            }

            out.textContent = JSON.stringify(data, null, 2);
            out.className = "";
        } catch (e) {
            out.textContent = "通信エラー: " + e.message;
            out.className = "";
        }
    }
    </script>
</body>
</html>
