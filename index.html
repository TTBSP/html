<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ODPT URL Executor</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        textarea { 
            width: 100%; height: 80px; background: #222; color: #76ff03; 
            border: 1px solid #444; padding: 10px; border-radius: 4px; font-family: monospace;
        }
        button { 
            margin-top: 10px; padding: 12px 24px; cursor: pointer; 
            background: #007bff; color: white; border: none; border-radius: 4px; width: 100%;
        }
        pre { background: #1a1a1a; padding: 15px; border-radius: 5px; overflow-x: auto; border: 1px solid #333; margin-top: 20px; }
        .error { color: #ff5252; }
    </style>
</head>
<body>

<div class="container">
    <h2>ODPT API URL 実行器</h2>
    <p style="font-size: 0.9em; color: #ccc;">api.odpt.org のURLをそのまま貼り付けてください。トークンは自動で置換されます。</p>
    
    <textarea id="urlInput" placeholder="https://api.odpt.org/api/v4/..."></textarea>
    <button onclick="executeApi()">APIを実行する</button>

    <pre id="out">結果待ち...</pre>
</div>

<script>
async function executeApi() {
    const out = document.getElementById("out");
    const inputUrl = document.getElementById("urlInput").value.trim();
    
    if(!inputUrl) {
        out.textContent = "URLを入力してください。";
        return;
    }

    out.textContent = "通信中...";
    out.classList.remove("error");

    // Cloudflare Workerへ送信。typeパラメータは不要になったのでextraにURLを込める
    const workerUrl = `https://train-api-pre.tt9549149.workers.dev/api?extra=${encodeURIComponent(inputUrl)}`;

    try {
        const res = await fetch(workerUrl);
        const data = await res.json();

        if (!res.ok) {
            out.classList.add("error");
            out.textContent = `エラー: ${data.message || data.error}`;
            return;
        }

        out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
        out.classList.add("error");
        out.textContent = "通信エラーが発生しました。";
    }
}
</script>
</body>
</html>
